<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<title>判断变量的布尔值</title>
<script type="text/javascript">
  // 定义两个变量：一个赋值，一个不赋值
  var a = 10;   // 赋值的变量（非零数字，布尔值为 true）
  var b;        // 未赋值的变量（undefined，布尔值为 false）

  // 判断赋值的变量的布尔值
  if (a) {
    alert("此网页显示\n赋值的变量布尔值为:true");
  } else {
    alert("此网页显示\n赋值的变量布尔值为:false");
  }

  // 判断未赋值的变量的布尔值
  if (b) {
    alert("此网页显示\n未赋值的变量布尔值为:true");
  } else {
    alert("此网页显示\n未赋值的变量布尔值为:false");
  }
</script>
</head>
<body>
</body>
</html>
