<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<title>4.1 使用HTML DOM实现订单页面</title>
<style>
  body { font-family: "Microsoft YaHei", sans-serif; padding: 20px; }
  h2 { margin-bottom: 12px; }
  table { border-collapse: collapse; width: 560px; }
  th, td { border: 1px solid #999; padding: 6px 10px; text-align: center; }
  th { background: #e6e6e6; }
  #addBtn { margin-top: 10px; padding: 6px 16px; cursor: pointer; }
</style>
</head>
<body>

<h2>订单页面</h2>

<table id="orderTable">
  <thead>
    <tr>
      <th>商品名称</th>
      <th>数量</th>
      <th>价格</th>
      <th>操作</th>
    </tr>
  </thead>
  <tbody id="orderBody">
  </tbody>
</table>

<button id="addBtn" onclick="addOrder()">增加订单</button>

<script>
  // 固定的商品名称与价格
  var GOODS_NAME  = "抗疲劳神奇钛项圈";
  var GOODS_PRICE = "¥49.00";

  // (1)(2)(3) 点击“增加订单”：计算行数 -> 插入行 -> 插入4个单元格并设置内容
  function addOrder() {
    var table = document.getElementById("orderTable");

    // (1) 使用集合 rows 和属性 length 计算当前表格中的行数，作为新增行的“数量”
    var rowCount = table.rows.length;

    // (2) 使用 insertRow 方法在表格末尾插入新行（-1 表示追加到最后）
    var row = table.insertRow(-1);

    // (3) 使用行对象的 insertCell 新增 4 个单元格，用 innerHTML 分别设置内容
    var cellName = row.insertCell(0);
    cellName.innerHTML = GOODS_NAME;

    var cellQty = row.insertCell(1);
    cellQty.innerHTML = rowCount;          // 数量列 = 当前行数

    var cellPrice = row.insertCell(2);
    cellPrice.innerHTML = GOODS_PRICE;

    var cellOp = row.insertCell(3);
    // (4) 传入当前对象 this，删除时据此定位到当前行
    cellOp.innerHTML = '<button onclick="deleteRow(this)">删除</button>';
  }

  // (4) 单击“删除”按钮：将当前对象作为参数，导航到当前行，用 deleteRow 删除
  function deleteRow(btn) {
    var row = btn.parentNode.parentNode;  // 由按钮导航到当前行 tr
    var table = document.getElementById("orderTable");
    table.deleteRow(row.rowIndex);        // 使用 deleteRow 删除该行
  }
</script>

</body>
</html>
